name: Validate hardened Rust SDK issue 974

on:
  push:
    branches:
      - ci/rust-sdk-issue-974-validation
    paths:
      - .github/workflows/validate-rust-sdk-issue-974.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out validation harness
        uses: actions/checkout@v4
        with:
          ref: ci/rust-sdk-issue-974-validation

      - name: Install Rust toolchains
        run: |
          rustup toolchain install stable --component clippy
          rustup toolchain install nightly --component rustfmt

      - name: Check out hardened branch
        id: clone
        continue-on-error: true
        run: |
          git clone --depth 1 --branch feat/issue-974-client-response-cache \
            https://github.com/starsaintf/rust-sdk.git rust-sdk
          git -C rust-sdk rev-parse HEAD > branch-sha.txt

      - name: Nightly formatting and whitespace
        id: formatting
        if: steps.clone.outcome == 'success'
        continue-on-error: true
        working-directory: rust-sdk
        run: |
          cargo +nightly fmt --all -- --check
          git diff --check

      - name: Check rmcp targets and features
        id: check
        if: steps.formatting.outcome == 'success'
        continue-on-error: true
        working-directory: rust-sdk
        run: cargo check -p rmcp --all-targets --all-features

      - name: Run repository Clippy command
        id: clippy
        if: steps.check.outcome == 'success'
        continue-on-error: true
        working-directory: rust-sdk
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run repository all-feature tests
        id: all_feature_tests
        if: steps.clippy.outcome == 'success'
        continue-on-error: true
        working-directory: rust-sdk
        run: cargo test --all-features

      - name: Run no-local rmcp feature tests
        id: no_local_tests
        if: steps.all_feature_tests.outcome == 'success'
        continue-on-error: true
        working-directory: rust-sdk
        run: |
          FEATURES=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '[.packages[] | select(.name == "rmcp") | .features | keys[] \
                      | select(startswith("__") | not) \
                      | select(. != "local")] | join(",")')
          echo "FEATURES=$FEATURES"
          cargo test -p rmcp --features "$FEATURES"

      - name: Build documentation with warnings denied
        id: docs
        if: steps.no_local_tests.outcome == 'success'
        continue-on-error: true
        working-directory: rust-sdk
        run: RUSTDOCFLAGS=-Dwarnings cargo doc -p rmcp --all-features --no-deps

      - name: Build conformance binaries
        id: conformance
        if: steps.docs.outcome == 'success'
        continue-on-error: true
        working-directory: rust-sdk
        run: cargo build -p mcp-conformance

      - name: Run focused cache tests
        id: focused
        if: steps.conformance.outcome == 'success'
        continue-on-error: true
        working-directory: rust-sdk
        run: cargo test -p rmcp --all-features service::client::tests -- --nocapture

      - name: Write validation result
        if: always()
        env:
          CLONE: ${{ steps.clone.outcome }}
          FORMATTING: ${{ steps.formatting.outcome }}
          CHECK: ${{ steps.check.outcome }}
          CLIPPY: ${{ steps.clippy.outcome }}
          ALL_FEATURE_TESTS: ${{ steps.all_feature_tests.outcome }}
          NO_LOCAL_TESTS: ${{ steps.no_local_tests.outcome }}
          DOCS: ${{ steps.docs.outcome }}
          CONFORMANCE: ${{ steps.conformance.outcome }}
          FOCUSED: ${{ steps.focused.outcome }}
        run: |
          branch_sha=unknown
          if [ -f branch-sha.txt ]; then branch_sha=$(cat branch-sha.txt); fi
          cat > ci/rust-sdk-issue-974-hardened-validation.txt <<EOF
          branch_sha=$branch_sha
          clone=$CLONE
          nightly_formatting=$FORMATTING
          rmcp_check=$CHECK
          repository_clippy=$CLIPPY
          all_feature_tests=$ALL_FEATURE_TESTS
          no_local_tests=$NO_LOCAL_TESTS
          docs=$DOCS
          conformance_build=$CONFORMANCE
          focused_cache_tests=$FOCUSED
          EOF

      - name: Commit validation result
        if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ci/rust-sdk-issue-974-hardened-validation.txt
          if ! git diff --cached --quiet; then
            git commit -m "test: record hardened issue 974 validation"
            git push origin HEAD:ci/rust-sdk-issue-974-validation
          fi

      - name: Require all checks
        if: always()
        env:
          CLONE: ${{ steps.clone.outcome }}
          FORMATTING: ${{ steps.formatting.outcome }}
          CHECK: ${{ steps.check.outcome }}
          CLIPPY: ${{ steps.clippy.outcome }}
          ALL_FEATURE_TESTS: ${{ steps.all_feature_tests.outcome }}
          NO_LOCAL_TESTS: ${{ steps.no_local_tests.outcome }}
          DOCS: ${{ steps.docs.outcome }}
          CONFORMANCE: ${{ steps.conformance.outcome }}
          FOCUSED: ${{ steps.focused.outcome }}
        run: |
          test "$CLONE" = success
          test "$FORMATTING" = success
          test "$CHECK" = success
          test "$CLIPPY" = success
          test "$ALL_FEATURE_TESTS" = success
          test "$NO_LOCAL_TESTS" = success
          test "$DOCS" = success
          test "$CONFORMANCE" = success
          test "$FOCUSED" = success
