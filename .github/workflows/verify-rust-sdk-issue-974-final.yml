name: Verify completed Rust SDK issue 974 branch

on:
  push:
    branches:
      - ci/rust-sdk-issue-974-validation
    paths:
      - .github/workflows/verify-rust-sdk-issue-974-final.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out harness
        uses: actions/checkout@v4
        with:
          ref: ci/rust-sdk-issue-974-validation

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, llvm-tools-preview

      - name: Install nightly rustfmt
        run: rustup toolchain install nightly --component rustfmt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install auxiliary cargo tools
        run: |
          cargo install cargo-semver-checks --locked
          cargo install cargo-public-api --locked
          cargo install cargo-llvm-cov --locked

      - name: Clone exact implementation branch
        run: |
          rm -rf rust-sdk-final
          git clone --branch feat/issue-974-client-response-cache --single-branch \
            https://github.com/starsaintf/rust-sdk.git rust-sdk-final
          git -C rust-sdk-final remote add upstream https://github.com/modelcontextprotocol/rust-sdk.git
          git -C rust-sdk-final fetch upstream main

      - name: Run and record all checks
        shell: bash
        run: |
          set +e
          cd rust-sdk-final
          result="../ci/rust-sdk-issue-974-final-result.txt"
          : > "$result"
          echo "branch_sha=$(git rev-parse HEAD)" >> "$result"
          echo "fork_main_sha=$(git rev-parse origin/main)" >> "$result"
          echo "upstream_main_sha=$(git rev-parse upstream/main)" >> "$result"

          run_check() {
            name="$1"
            shift
            echo "==> $name"
            "$@"
            status=$?
            if [ "$status" -eq 0 ]; then
              echo "$name=success" | tee -a "$result"
            else
              echo "$name=failed($status)" | tee -a "$result"
            fi
          }

          run_check upstream_alignment test "$(git rev-parse origin/main)" = "$(git rev-parse upstream/main)"
          run_check nightly_format_check cargo +nightly fmt --all -- --check
          run_check whitespace git diff --check
          run_check workspace_check cargo check --workspace --all-targets --all-features
          run_check clippy cargo clippy --all-targets --all-features -- -D warnings
          run_check default_member_tests cargo test --all-features

          FEATURES=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '[.packages[] | select(.name == "rmcp") | .features | keys[] \
                      | select(startswith("__") | not) \
                      | select(. != "local")] | join(",")')
          run_check no_local_tests cargo test -p rmcp --features "$FEATURES"
          run_check focused_cache_tests cargo test -p rmcp --all-features service::client::tests -- --nocapture
          run_check cache_hint_tests cargo test -p rmcp --all-features --test test_cache_hints -- --nocapture
          run_check doctests cargo test -p rmcp --doc --all-features
          run_check rustdoc env RUSTDOCFLAGS=-Dwarnings cargo doc -p rmcp --all-features --no-deps
          run_check conformance_tests cargo test --manifest-path conformance/Cargo.toml --all-features

          for dir in examples/*/; do
            if [ -f "$dir/Cargo.toml" ]; then
              if [[ "$dir" == *"wasi"* ]]; then
                rustup target add wasm32-wasip2
                run_check "example_build_${dir//\//_}" cargo build --manifest-path "$dir/Cargo.toml" --target wasm32-wasip2
              else
                run_check "example_build_${dir//\//_}" cargo build --manifest-path "$dir/Cargo.toml" --all-features --tests
                run_check "example_test_${dir//\//_}" cargo test --manifest-path "$dir/Cargo.toml" --all-features --all-targets
              fi
            fi
          done

          run_check semver_default cargo semver-checks \
            --package rmcp --baseline-rev upstream/main --release-type minor \
            --only-explicit-features --features default
          run_check semver_non_local cargo semver-checks \
            --package rmcp --baseline-rev upstream/main --release-type minor \
            --only-explicit-features --features "$FEATURES"
          run_check public_api_default cargo public-api \
            --package rmcp -ss diff --deny changed --deny removed --force upstream/main..HEAD
          run_check public_api_non_local cargo public-api \
            --package rmcp --features "$FEATURES" -ss diff \
            --deny changed --deny removed --force upstream/main..HEAD
          run_check coverage cargo llvm-cov -p rmcp --all-features --no-report

          if grep -q '=failed' "$result"; then
            echo 'overall=failed' >> "$result"
          else
            echo 'overall=success' >> "$result"
          fi

      - name: Commit verification report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci/rust-sdk-issue-974-final-result.txt
          git commit -m "ci: record final rust-sdk issue 974 verification" || true
          git push origin HEAD:ci/rust-sdk-issue-974-validation
